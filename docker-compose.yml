services:
  cms:
    build: .
    restart: unless-stopped
    network_mode: host   # avoids new network namespace (fixes sysctl issue in LXC)
    volumes:
      - ./content:/app/content       # persists content.json + uploaded PDFs
      - ./live-site:/app/live-site   # persists the cloned live GitHub Pages repo
    env_file:
      - .env
